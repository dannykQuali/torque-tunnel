spec_version: 2
description: |
  Execute shell commands directly on the Torque agent container.
  This blueprint runs commands locally on the agent without SSH to any remote host.
  Useful for running scripts, tools, or commands that don't require a target machine.

inputs:
  agent:
    type: agent
    description: The Torque agent to use for execution
  timeout_minutes:
    type: string
    description: Maximum execution time in minutes before auto-termination
    default: '30'
  command_b64:
    type: string
    description: Gzip-compressed and base64-encoded shell command(s) to execute on the agent
  init_commands_b64:
    type: string
    description: Gzip-compressed and base64-encoded init commands (optional)
    default: ""
  finally_commands_b64:
    type: string
    description: Gzip-compressed and base64-encoded finally commands (optional)
    default: ""
  download_commands_b64:
    type: string
    description: Gzip-compressed and base64-encoded commands to run after execution completes (e.g., croc send to local)
    default: ""
  credential_context_b64:
    type: string
    description: Gzip-compressed and base64-encoded JSON describing the attached Torque credential (variable names and non-secret values only - never a secret). Empty when no credential is used.
    default: ""
  # __TT_CREDENTIAL_INPUT__

outputs:
  command_output:
    value: '{{ .grains.local_executor.activities.deploy.commands.run_local.outputs.command_output }}'
  exit_code:
    value: '{{ .grains.local_executor.activities.deploy.commands.run_local.outputs.exit_code }}'
  execution_duration_ms:
    value: '{{ .grains.local_executor.activities.deploy.commands.run_local.outputs.execution_duration_ms }}'

grains:
  local_executor:
    kind: shell
    spec:
      agent:
        name: '{{ .inputs.agent }}'
      # __TT_CREDENTIAL_AUTH__
      activities:
        deploy:
          commands:
            - name: run_local
              command: |
                # Disable exit on error so we always reach the export statements
                set +e

                # Initialize variables with defaults
                OUTPUT_FILE=$(mktemp)
                EXIT_CODE_FILE=$(mktemp)
                echo "1" > "$EXIT_CODE_FILE"  # Default exit code
                COMBINED=""

                # Decode base64 inputs ONCE into temp files, reused by the visibility dump,
                # the combined-script build, and the download section. Each payload must appear
                # only a single time in this script's source: the runner ships/echoes the full
                # source, and duplicated multi-hundred-KB inline file payloads were observed
                # to stall it for many minutes before execution even started.
                SCRIPT_FILE=$(mktemp)
                echo '{{ .inputs.command_b64 }}' | base64 -d 2>/dev/null | gzip -d > "$SCRIPT_FILE" 2>/dev/null || true
                INIT_FILE=$(mktemp)
                echo '{{ .inputs.init_commands_b64 }}' | base64 -d 2>/dev/null | gzip -d > "$INIT_FILE" 2>/dev/null || true
                FINALLY_FILE=$(mktemp)
                echo '{{ .inputs.finally_commands_b64 }}' | base64 -d 2>/dev/null | gzip -d > "$FINALLY_FILE" 2>/dev/null || true

                # --- Credential redaction -----------------------------------------------------
                # When a Torque credential is attached its secrets are in THIS container's
                # environment. Torque has no log masking, so a command that prints one would leak
                # it into the returned output and the Torque UI log alike. The execution stream is
                # therefore piped through a redactor that rewrites those values as ***.
                #
                # The context below carries variable NAMES and NON-SECRET values only - never a
                # secret. Secrets are read here, from this container's own environment. A value
                # that is NOT among the non-secret ones came from a field Torque returned as null,
                # i.e. a secret; that is what makes redaction work without a per-type table.
                __TT_CRED_CTX=$(mktemp)
                echo '{{ .inputs.credential_context_b64 }}' | base64 -d 2>/dev/null | gzip -d > "$__TT_CRED_CTX" 2>/dev/null || true
                export __TT_CRED_CTX
                __TT_REDACT_PY=$(mktemp)
                cat > "$__TT_REDACT_PY" <<'__TT_REDACT_EOF'
                import json, os, sys

                try:
                    with open(os.environ.get("__TT_CRED_CTX", ""), "r") as _f:
                        ctx = json.load(_f)
                except Exception:
                    ctx = {}

                names = ctx.get("vars") or []
                public = set(str(v) for v in (ctx.get("public_values") or []))
                minlen = int(ctx.get("min_len") or 8)

                secrets, skipped, present = [], [], []
                for n in names:
                    v = os.environ.get(n)
                    if not v:
                        continue
                    present.append(n)
                    if v in public:
                        continue
                    if len(v) < minlen:
                        skipped.append(n)
                        continue
                    secrets.append(v)

                # Longest first, so a secret that contains another is masked whole.
                secrets = sorted(set(secrets), key=len, reverse=True)

                warnings = []
                if names and not present:
                    warnings.append(
                        "WARNING: none of the expected variables for credential type '%s' are set (%s). "
                        "The cached variable list may be stale - output was NOT redacted. "
                        "Re-run list_credentials with force_rediscover to refresh." % (ctx.get("type"), ", ".join(names)))
                if skipped:
                    warnings.append(
                        "NOTE: values shorter than %d characters are not redacted, so these were left as-is: %s"
                        % (minlen, ", ".join(skipped)))

                out = sys.stdout.buffer
                for w in warnings:
                    out.write(("[torque-tunnel] " + w + "\n").encode("utf-8"))
                out.flush()

                # Operate on bytes so arbitrary command output cannot break the filter on decoding.
                secrets_b = [s.encode("utf-8", "surrogateescape") for s in secrets]
                stdin = sys.stdin.buffer
                while True:
                    line = stdin.readline()
                    if not line:
                        break
                    for s in secrets_b:
                        if s in line:
                            line = line.replace(s, b"***")
                    out.write(line)
                    out.flush()
                __TT_REDACT_EOF
                if [ -s "$__TT_CRED_CTX" ] && command -v python3 >/dev/null 2>&1; then
                  __tt_filter() { python3 -u "$__TT_REDACT_PY"; }
                else
                  if [ -s "$__TT_CRED_CTX" ]; then
                    echo "[torque-tunnel] WARNING: python3 is unavailable on this agent - credential values will NOT be redacted from output."
                  fi
                  __tt_filter() { cat; }
                fi

                # --- Print the commands for visibility in the Torque web UI (decoded) ---
                # Shown before execution so a user inspecting the environment can read what
                # ran without decoding the gzip+base64 inputs. Placed before the execution
                # marker so the MCP output filter still returns only command output.
                # Note: upload-only / download-only calls carry no real command; the MCP
                # tool substitutes this placeholder (keep in sync with mcp_tool handlers).
                # We recognize it so the dump doesn't present a fake command.
                __TT_NO_CMD="echo 'Files deployed successfully'"
                __tt_show_cmd() {  # $1 = label, $2 = already-decoded file path
                  if [ -s "$2" ]; then
                    if [ "$1" = "command" ] && [ "$(cat "$2")" = "$__TT_NO_CMD" ]; then
                      echo "----- command (none - file upload/download only) -----"
                      echo ""
                    else
                      echo "----- $1 -----"
                      # Redact inline file-upload payloads (long base64 runs) for DISPLAY only —
                      # execution uses the decoded files directly, this is just the log dump.
                      sed -E 's|[A-Za-z0-9+/=]{200,}|<file payload omitted>|g' "$2"
                      echo ""
                    fi
                  fi
                }
                echo "=== Commands (decoded for visibility) =========================================================================================================="
                __tt_show_cmd "init commands" "$INIT_FILE"
                __tt_show_cmd "command" "$SCRIPT_FILE"
                __tt_show_cmd "finally commands" "$FINALLY_FILE"
                echo "==============================================================================================================================================="

                echo "=== Beginning of local execution ============================================================================================================="

                # Wrap the main logic in a function so we can capture any errors
                __run_main() {
                  # SCRIPT_FILE / INIT_FILE / FINALLY_FILE were decoded once at the top of this script.

                  # Build combined script
                  COMBINED=$(mktemp)
                  echo '#!/bin/bash' > "$COMBINED"
                  
                  # Track exit code for proper propagation
                  echo '__EXIT_CODE=0' >> "$COMBINED"
                  
                  # Add finally trap if provided - wrapped with </dev/null to prevent stdin reads
                  if [ -s "$FINALLY_FILE" ]; then
                    echo '__finally() {' >> "$COMBINED"
                    echo '(' >> "$COMBINED"
                    cat "$FINALLY_FILE" >> "$COMBINED"
                    echo '' >> "$COMBINED"
                    echo ') </dev/null' >> "$COMBINED"
                    echo '}' >> "$COMBINED"
                    echo 'trap __finally EXIT' >> "$COMBINED"
                  fi
                  
                  # Add init commands if provided - check exit code and skip main if failed
                  # Use curly braces (not subshell) so exports persist
                  if [ -s "$INIT_FILE" ]; then
                    echo "=== Running init commands ==="
                    echo '{' >> "$COMBINED"
                    cat "$INIT_FILE" >> "$COMBINED"
                    echo '' >> "$COMBINED"
                    echo '} </dev/null' >> "$COMBINED"
                    echo '__EXIT_CODE=$?' >> "$COMBINED"
                    echo 'if [ $__EXIT_CODE -ne 0 ]; then exit $__EXIT_CODE; fi' >> "$COMBINED"
                  fi
                  
                  # Add main command - wrapped with </dev/null to prevent stdin reads
                  echo '(' >> "$COMBINED"
                  cat "$SCRIPT_FILE" >> "$COMBINED"
                  echo '' >> "$COMBINED"
                  echo ') </dev/null' >> "$COMBINED"
                  
                  chmod +x "$COMBINED"
                  
                  echo "=== Executing on agent container ==="
                  echo "=== Output (streaming) ========================================================================================================================="
                  
                  # Calculate timeout in seconds from minutes input
                  TIMEOUT_SECONDS=$(( {{ .inputs.timeout_minutes }} * 60 ))
                  
                  START_TIME=$(date +%s%3N 2>/dev/null || echo "$(date +%s)000")
                  # Run the script (commands inside already have </dev/null protection).
                  # __tt_filter redacts attached-credential secrets from the stream BEFORE it
                  # is tee'd, so neither the returned output nor the Torque UI log can carry
                  # them. It is a plain `cat` when no credential is attached.
                  timeout "${TIMEOUT_SECONDS}" \
                  bash "$COMBINED" 2>&1 | __tt_filter | tee "$OUTPUT_FILE"
                  CMD_STATUS=${PIPESTATUS[0]}
                  # timeout returns 124 when the command times out
                  if [ $CMD_STATUS -eq 124 ]; then
                    echo "" >> "$OUTPUT_FILE"
                    echo "=== COMMAND TIMED OUT after {{ .inputs.timeout_minutes }} minutes ===" | tee -a "$OUTPUT_FILE"
                  fi
                  echo "$CMD_STATUS" > "$EXIT_CODE_FILE"
                  END_TIME=$(date +%s%3N 2>/dev/null || echo "$(date +%s)000")
                  EXEC_DURATION_MS=$((END_TIME - START_TIME))
                }
                
                # Run main logic - errors go to output file, stdout is already captured inside
                __run_main 2>> "$OUTPUT_FILE"
                
                # Run download commands if provided (after main execution + finally, before exports)
                __DL_CMDS=$(mktemp)
                echo '{{ .inputs.download_commands_b64 }}' | base64 -d | gzip -d > "$__DL_CMDS" 2>/dev/null || true
                if [ -s "$__DL_CMDS" ]; then
                  echo "=== Running download commands ==="
                  # Re-source init commands so proxy/env vars are available for downloads
                  # (init ran inside __run_main's subprocess, exports didn't propagate back).
                  # INIT_FILE was decoded once at the top and is still present here.
                  if [ -s "$INIT_FILE" ]; then
                    . "$INIT_FILE"
                  fi
                  bash "$__DL_CMDS"
                  __DL_CMD_RC=$?
                  if [ $__DL_CMD_RC -ne 0 ]; then
                    echo "WARNING: Download commands failed (exit code: $__DL_CMD_RC)" >&2
                  fi
                fi
                rm -f "$__DL_CMDS" 2>/dev/null || true
                
                # Always export outputs - this section MUST be reached
                COMMAND_OUTPUT_B64=$(base64 < "$OUTPUT_FILE" 2>/dev/null | tr -d '\n' || echo "")
                CMD_EXIT_CODE=$(cat "$EXIT_CODE_FILE" 2>/dev/null || echo "1")
                rm -f "$OUTPUT_FILE" "$EXIT_CODE_FILE" "$SCRIPT_FILE" "$INIT_FILE" "$FINALLY_FILE" "$COMBINED" "$__TT_CRED_CTX" "$__TT_REDACT_PY" 2>/dev/null || true
                
                export command_output="$COMMAND_OUTPUT_B64"
                export exit_code="$CMD_EXIT_CODE"
                export execution_duration_ms="${EXEC_DURATION_MS:-0}"
                
                echo ""
                echo "=== Command completed with exit code: $CMD_EXIT_CODE ==="
              outputs:
                - command_output
                - exit_code
                - execution_duration_ms

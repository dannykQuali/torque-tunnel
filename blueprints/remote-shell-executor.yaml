spec_version: 2
description: |
  Execute shell commands on a remote host via SSH.
  This blueprint is designed to be called programmatically by the torque-tunnel MCP tool
  to enable Copilot to run commands on remote servers for troubleshooting.

inputs:
  agent:
    type: agent
    description: The Torque agent to use for execution
  timeout_minutes:
    type: string
    description: Maximum execution time in minutes before auto-termination
    default: '30'
  target_ip:
    type: string
    description: The IP address or hostname of the target server
  ssh_user:
    type: string
    description: The SSH username to connect with
  ssh_private_key:
    type: string
    description: The SSH private key in PEM format for authentication (use this OR ssh_password)
    sensitive: true
    default: ""
  ssh_password:
    type: string
    description: SSH password for authentication (use this OR ssh_private_key)
    sensitive: true
    default: ""
  command_b64:
    type: string
    description: Gzip-compressed and base64-encoded shell command(s) to execute on the remote host
  init_commands_b64:
    type: string
    description: Gzip-compressed and base64-encoded init commands (e.g., proxy setup)
    default: ""
  finally_commands_b64:
    type: string
    description: Gzip-compressed and base64-encoded finally commands (cleanup, always runs)
    default: ""
  container_pre_commands_b64:
    type: string
    description: Gzip-compressed and base64-encoded commands to run ON THE CONTAINER before SSH (e.g., croc file receive + SCP to target)
    default: ""
  download_commands_b64:
    type: string
    description: Gzip-compressed and base64-encoded commands to run ON THE CONTAINER after SSH completes (e.g., SCP from target + croc send to local)
    default: ""
  credential_context_b64:
    type: string
    description: Gzip-compressed and base64-encoded JSON describing the attached Torque credential (variable names and non-secret values only - never a secret). Empty when no credential is used.
    default: ""
  # __TT_CREDENTIAL_INPUT__

outputs:
  command_output:
    value: '{{ .grains.remote_executor.activities.deploy.commands.run_ssh.outputs.command_output }}'
  exit_code:
    value: '{{ .grains.remote_executor.activities.deploy.commands.run_ssh.outputs.exit_code }}'
  execution_duration_ms:
    value: '{{ .grains.remote_executor.activities.deploy.commands.run_ssh.outputs.execution_duration_ms }}'

grains:
  remote_executor:
    kind: shell
    spec:
      agent:
        name: '{{ .inputs.agent }}'
      # __TT_CREDENTIAL_AUTH__
      activities:
        deploy:
          commands:
            - name: run_ssh
              command: |
                # Disable exit on error so we always reach the export statements
                set +e
                
                # Initialize variables with defaults (before container pre-commands so
                # the failure path can write to OUTPUT_FILE/EXIT_CODE_FILE and flow to exports)
                OUTPUT_FILE=$(mktemp)
                EXIT_CODE_FILE=$(mktemp)
                echo "1" > "$EXIT_CODE_FILE"  # Default exit code
                KEY_FILE=""
                REMOTE_SCRIPT=""
                __SKIP_SSH=0

                # Decode base64 inputs ONCE into temp files, reused by the visibility dump,
                # the remote-script build, and the download section. Each payload must appear
                # only a single time in this script's source: the runner ships/echoes the full
                # source, and duplicated multi-hundred-KB inline file payloads were observed
                # to stall it for many minutes before execution even started.
                CMD_FILE=$(mktemp)
                echo '{{ .inputs.command_b64 }}' | base64 -d 2>/dev/null | gzip -d > "$CMD_FILE" 2>/dev/null || true
                INIT_FILE=$(mktemp)
                echo '{{ .inputs.init_commands_b64 }}' | base64 -d 2>/dev/null | gzip -d > "$INIT_FILE" 2>/dev/null || true
                FINALLY_FILE=$(mktemp)
                echo '{{ .inputs.finally_commands_b64 }}' | base64 -d 2>/dev/null | gzip -d > "$FINALLY_FILE" 2>/dev/null || true

                # --- Attached Torque credential ----------------------------------------------
                # Two jobs here, both driven by the same context blob:
                #
                #  1. FORWARDING. The credential's variables are injected into THIS container,
                #     but the command runs on the target host over SSH, so they have to be
                #     re-exported into the remote script. The blob carries variable NAMES only
                #     (names are not secret); the VALUES are read here, from this container's
                #     own environment, and never travel from the caller.
                #  2. REDACTION. Torque has no log masking, so a command that prints a secret
                #     would leak it into the returned output and the Torque UI log alike. The
                #     execution stream is piped through a redactor that rewrites those values.
                #     A value that is NOT among the blob's non-secret values came from a field
                #     Torque returned as null, i.e. a secret - which is what lets this work
                #     without a per-credential-type table of which field is which.
                __TT_CRED_CTX=$(mktemp)
                echo '{{ .inputs.credential_context_b64 }}' | base64 -d 2>/dev/null | gzip -d > "$__TT_CRED_CTX" 2>/dev/null || true
                export __TT_CRED_CTX
                __TT_REDACT_PY=$(mktemp)
                cat > "$__TT_REDACT_PY" <<'__TT_REDACT_EOF'
                import json, os, sys

                try:
                    with open(os.environ.get("__TT_CRED_CTX", ""), "r") as _f:
                        ctx = json.load(_f)
                except Exception:
                    ctx = {}

                names = ctx.get("vars") or []
                public = set(str(v) for v in (ctx.get("public_values") or []))
                minlen = int(ctx.get("min_len") or 8)

                secrets, skipped, present = [], [], []
                for n in names:
                    v = os.environ.get(n)
                    if not v:
                        continue
                    present.append(n)
                    if v in public:
                        continue
                    if len(v) < minlen:
                        skipped.append(n)
                        continue
                    secrets.append(v)

                # Longest first, so a secret that contains another is masked whole.
                secrets = sorted(set(secrets), key=len, reverse=True)

                warnings = []
                if names and not present:
                    warnings.append(
                        "WARNING: none of the expected variables for credential type '%s' are set (%s). "
                        "The cached variable list may be stale - output was NOT redacted. "
                        "Re-run list_credentials with force_rediscover to refresh." % (ctx.get("type"), ", ".join(names)))
                if skipped:
                    warnings.append(
                        "NOTE: values shorter than %d characters are not redacted, so these were left as-is: %s"
                        % (minlen, ", ".join(skipped)))

                out = sys.stdout.buffer
                for w in warnings:
                    out.write(("[torque-tunnel] " + w + "\n").encode("utf-8"))
                out.flush()

                # Operate on bytes so arbitrary command output cannot break the filter on decoding.
                secrets_b = [s.encode("utf-8", "surrogateescape") for s in secrets]
                stdin = sys.stdin.buffer
                while True:
                    line = stdin.readline()
                    if not line:
                        break
                    for s in secrets_b:
                        if s in line:
                            line = line.replace(s, b"***")
                    out.write(line)
                    out.flush()
                __TT_REDACT_EOF
                if [ -s "$__TT_CRED_CTX" ] && command -v python3 >/dev/null 2>&1; then
                  __tt_filter() { python3 -u "$__TT_REDACT_PY"; }
                else
                  if [ -s "$__TT_CRED_CTX" ]; then
                    echo "[torque-tunnel] WARNING: python3 is unavailable on this agent - credential values will NOT be redacted from output."
                  fi
                  __tt_filter() { cat; }
                fi

                # Names of the variables to re-export on the remote host. Derived from the
                # context blob plus MGMT_SERVER_* (forwarded by design - existing blueprint
                # contract). Names only; nothing secret is in this variable.
                __TT_FORWARD_VARS=""
                if [ -s "$__TT_CRED_CTX" ] && command -v python3 >/dev/null 2>&1; then
                  __TT_FORWARD_VARS=$(python3 -c 'import json,os;print(" ".join((json.load(open(os.environ["__TT_CRED_CTX"])).get("forward") or [])))' 2>/dev/null || echo "")
                fi
                for __v in $(compgen -e | grep '^MGMT_SERVER_' 2>/dev/null); do
                  __TT_FORWARD_VARS="$__TT_FORWARD_VARS $__v"
                done

                # Run container pre-commands (e.g., croc file receive + SCP to target)
                # These run ON THE CONTAINER before any SSH connection to the target.
                __CONTAINER_PRE=$(mktemp)
                echo '{{ .inputs.container_pre_commands_b64 }}' | base64 -d | gzip -d > "$__CONTAINER_PRE" 2>/dev/null || true
                if [ -s "$__CONTAINER_PRE" ]; then
                  echo "=== Running container pre-commands ==="
                  bash "$__CONTAINER_PRE"
                  __PRE_RC=$?
                  rm -f "$__CONTAINER_PRE"
                  if [ $__PRE_RC -ne 0 ]; then
                    echo "ERROR: Container pre-commands failed (exit code: $__PRE_RC)" >&2
                    echo "Container pre-commands failed with exit code $__PRE_RC" > "$OUTPUT_FILE"
                    echo "$__PRE_RC" > "$EXIT_CODE_FILE"
                    EXEC_DURATION_MS=0
                    __SKIP_SSH=1
                  fi
                fi
                rm -f "$__CONTAINER_PRE" 2>/dev/null || true

                # --- Print the commands for visibility in the Torque web UI (decoded) ---
                # Shown before execution so a user inspecting the environment can read what
                # ran without decoding the gzip+base64 inputs. Placed before the execution
                # marker so the MCP output filter still returns only command output.
                # Note: upload-only / download-only calls carry no real command; the MCP
                # tool substitutes this placeholder (keep in sync with mcp_tool handlers).
                # We recognize it so the dump doesn't present a fake command.
                __TT_NO_CMD="echo 'Files deployed successfully'"
                __tt_show_cmd() {  # $1 = label, $2 = already-decoded file path
                  if [ -s "$2" ]; then
                    if [ "$1" = "command" ] && [ "$(cat "$2")" = "$__TT_NO_CMD" ]; then
                      echo "----- command (none - file upload/download only) -----"
                      echo ""
                    else
                      echo "----- $1 -----"
                      # Redact inline file-upload payloads (long base64 runs) for DISPLAY only —
                      # execution uses the decoded files directly, this is just the log dump.
                      sed -E 's|[A-Za-z0-9+/=]{200,}|<file payload omitted>|g' "$2"
                      echo ""
                    fi
                  fi
                }
                echo "=== Commands (decoded for visibility) =========================================================================================================="
                __tt_show_cmd "init commands" "$INIT_FILE"
                __tt_show_cmd "command" "$CMD_FILE"
                __tt_show_cmd "finally commands" "$FINALLY_FILE"
                echo "==============================================================================================================================================="

                echo "=== Beginning of execution ====================================================================================================================="
                
                # Wrap the main logic in a function so we can capture any errors
                __run_main() {
                  # Determine auth method: private key or password
                  SSH_AUTH_ARGS=""
                  KEY_FILE=""
                  SSH_PASS_PREFIX=""
                  
                  SSH_PASSWORD='{{ .inputs.ssh_password }}'
                  SSH_PRIVATE_KEY='{{ .inputs.ssh_private_key }}'
                  
                  if [ -n "$SSH_PRIVATE_KEY" ]; then
                    # Key-based authentication
                    KEY_FILE=$(mktemp)
                    cat << 'KEYEOF' > "$KEY_FILE"
                {{ .inputs.ssh_private_key }}
                KEYEOF
                    chmod 600 "$KEY_FILE"
                    SSH_AUTH_ARGS="-i $KEY_FILE"
                  elif [ -n "$SSH_PASSWORD" ]; then
                    # Password-based authentication using sshpass
                    if ! command -v sshpass &>/dev/null; then
                      # Try install without apt-get update first (~2s vs ~17s with update)
                      apt-get install -y -qq sshpass >/dev/null 2>&1 \
                        || { apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq sshpass >/dev/null 2>&1; }
                      if ! command -v sshpass &>/dev/null; then
                        echo "ERROR: Failed to install sshpass. Use private_key authentication instead." >&2
                        echo "1" > "$EXIT_CODE_FILE"
                        return
                      fi
                    fi
                    SSH_AUTH_ARGS="-o PubkeyAuthentication=no"
                    SSH_PASS_PREFIX="sshpass -p '$SSH_PASSWORD'"
                  else
                    echo "ERROR: Either ssh_private_key or ssh_password must be provided." >&2
                    echo "1" > "$EXIT_CODE_FILE"
                    return
                  fi
                  
                  REMOTE_SCRIPT=$(mktemp)

                  # CMD_FILE / INIT_FILE / FINALLY_FILE were decoded once at the top of this script.

                  # Build remote script
                  echo '#!/bin/bash' > "$REMOTE_SCRIPT"

                  # Forward the attached credential's variables (and MGMT_SERVER_*) to the
                  # target. Emitted FIRST so init/command/finally can all use them. printf %q
                  # quotes each value safely; a variable that is not set is skipped rather than
                  # exported empty. Note this writes secrets into the remote script, which is
                  # the point - it is how the command on the target gets to use them.
                  for __v in $__TT_FORWARD_VARS; do
                    if [ -n "${!__v+x}" ]; then
                      printf 'export %s=%q\n' "$__v" "${!__v}" >> "$REMOTE_SCRIPT"
                    fi
                  done

                  # Track exit code for proper propagation
                  echo '__EXIT_CODE=0' >> "$REMOTE_SCRIPT"
                  
                  # Add finally trap if provided - wrapped with </dev/null to prevent stdin reads
                  if [ -s "$FINALLY_FILE" ]; then
                    echo '__finally() {' >> "$REMOTE_SCRIPT"
                    echo '(' >> "$REMOTE_SCRIPT"
                    cat "$FINALLY_FILE" >> "$REMOTE_SCRIPT"
                    echo '' >> "$REMOTE_SCRIPT"
                    echo ') </dev/null' >> "$REMOTE_SCRIPT"
                    echo '}' >> "$REMOTE_SCRIPT"
                    echo 'trap __finally EXIT' >> "$REMOTE_SCRIPT"
                  fi
                  
                  # Add init commands if provided - check exit code and skip main if failed
                  # Use curly braces (not subshell) so exports persist
                  if [ -s "$INIT_FILE" ]; then
                    echo '{' >> "$REMOTE_SCRIPT"
                    cat "$INIT_FILE" >> "$REMOTE_SCRIPT"
                    echo '' >> "$REMOTE_SCRIPT"
                    echo '} </dev/null' >> "$REMOTE_SCRIPT"
                    echo '__EXIT_CODE=$?' >> "$REMOTE_SCRIPT"
                    echo 'if [ $__EXIT_CODE -ne 0 ]; then exit $__EXIT_CODE; fi' >> "$REMOTE_SCRIPT"
                  fi
                  
                  # Add main command - wrapped with </dev/null to prevent stdin reads from hanging
                  # since this is a non-interactive execution context
                  echo '(' >> "$REMOTE_SCRIPT"
                  cat "$CMD_FILE" >> "$REMOTE_SCRIPT"
                  echo '' >> "$REMOTE_SCRIPT"
                  echo ') </dev/null' >> "$REMOTE_SCRIPT"
                  
                  echo "=== Connecting to {{ .inputs.ssh_user }}@{{ .inputs.target_ip }} ==="
                  echo "=== Output (streaming) ========================================================================================================================="
                  
                  # Calculate timeout in seconds from minutes input
                  TIMEOUT_SECONDS=$(( {{ .inputs.timeout_minutes }} * 60 ))
                  
                  START_TIME=$(date +%s%3N 2>/dev/null || echo "$(date +%s)000")
                  if [ -n "$SSH_PASS_PREFIX" ]; then
                    timeout "${TIMEOUT_SECONDS}" \
                    sshpass -p "$SSH_PASSWORD" \
                    ssh -o StrictHostKeyChecking=no \
                        -o UserKnownHostsFile=/dev/null \
                        -o LogLevel=ERROR \
                        -o PubkeyAuthentication=no \
                        "{{ .inputs.ssh_user }}@{{ .inputs.target_ip }}" \
                        "bash -s" < "$REMOTE_SCRIPT" 2>&1 | __tt_filter | tee "$OUTPUT_FILE"
                  else
                    timeout "${TIMEOUT_SECONDS}" \
                    ssh -o StrictHostKeyChecking=no \
                        -o UserKnownHostsFile=/dev/null \
                        -o LogLevel=ERROR \
                        -i "$KEY_FILE" \
                        "{{ .inputs.ssh_user }}@{{ .inputs.target_ip }}" \
                        "bash -s" < "$REMOTE_SCRIPT" 2>&1 | __tt_filter | tee "$OUTPUT_FILE"
                  fi
                  SSH_STATUS=${PIPESTATUS[0]}
                  # timeout returns 124 when the command times out
                  if [ $SSH_STATUS -eq 124 ]; then
                    echo "" >> "$OUTPUT_FILE"
                    echo "=== COMMAND TIMED OUT after {{ .inputs.timeout_minutes }} minutes ===" | tee -a "$OUTPUT_FILE"
                  fi
                  echo "$SSH_STATUS" > "$EXIT_CODE_FILE"
                  END_TIME=$(date +%s%3N 2>/dev/null || echo "$(date +%s)000")
                  EXEC_DURATION_MS=$((END_TIME - START_TIME))
                }
                
                # Run main logic - errors go to output file, stdout is already captured inside
                # Skip SSH if container pre-commands failed (output already written)
                if [ $__SKIP_SSH -eq 0 ]; then
                  __run_main 2>> "$OUTPUT_FILE"
                fi
                
                # Run download commands if provided (after main execution + finally, before exports)
                __DL_CMDS=$(mktemp)
                echo '{{ .inputs.download_commands_b64 }}' | base64 -d | gzip -d > "$__DL_CMDS" 2>/dev/null || true
                if [ -s "$__DL_CMDS" ]; then
                  echo "=== Running download commands ==="
                  # Re-source init commands so proxy/env vars are available for downloads
                  # (init ran inside __run_main's subprocess, exports didn't propagate back).
                  # INIT_FILE was decoded once at the top and is still present here.
                  if [ -s "$INIT_FILE" ]; then
                    . "$INIT_FILE"
                  fi
                  bash "$__DL_CMDS"
                  __DL_CMD_RC=$?
                  if [ $__DL_CMD_RC -ne 0 ]; then
                    echo "WARNING: Download commands failed (exit code: $__DL_CMD_RC)" >&2
                  fi
                fi
                rm -f "$__DL_CMDS" 2>/dev/null || true

                # Always export outputs - this section MUST be reached
                COMMAND_OUTPUT_B64=$(base64 < "$OUTPUT_FILE" 2>/dev/null | tr -d '\n' || echo "")
                SSH_EXIT_CODE=$(cat "$EXIT_CODE_FILE" 2>/dev/null || echo "1")
                rm -f "$KEY_FILE" "$OUTPUT_FILE" "$EXIT_CODE_FILE" "$REMOTE_SCRIPT" "$CMD_FILE" "$INIT_FILE" "$FINALLY_FILE" "$__TT_CRED_CTX" "$__TT_REDACT_PY" 2>/dev/null || true
                
                export command_output="$COMMAND_OUTPUT_B64"
                export exit_code="$SSH_EXIT_CODE"
                export execution_duration_ms="${EXEC_DURATION_MS:-0}"
                
                echo ""
                echo "=== Command completed with exit code: $SSH_EXIT_CODE ==="
              outputs:
                - command_output
                - exit_code
                - execution_duration_ms
